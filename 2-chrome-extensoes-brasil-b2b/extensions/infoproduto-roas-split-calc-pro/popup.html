<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Kiwify, Hotmart & Eduzz Calculadora ROAS, Reembolso & Split</title>
  <style>
    body { width: 380px; margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 14px; }
    .hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 12px; }
    .title { font-size: 14px; font-weight: 700; color: #38bdf8; }
    .badge { font-size: 10px; background: #065f46; color: #6ee7b7; padding: 3px 7px; border-radius: 99px; font-weight: 600; }
    .field { margin-bottom: 9px; }
    .field label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 3px; }
    .field input { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 13px; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 8px 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .result-box { margin-top: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
    .footer { margin-top: 10px; font-size: 10px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="title">Kiwify, Hotmart & Eduzz Calculadora ROAS, Reembolso & Split</div>
    <span class="badge">100% Local • LGPD</span>
  </div>
  <div class="field"><label>Vendas Brutas (R$)</label><input type="number" step="0.01" id="v0" value="48000.0"></div>
  <div class="field"><label>Gasto Tráfego Ads (R$)</label><input type="number" step="0.01" id="v1" value="16500.0"></div>
  <div class="field"><label>Taxa Plataforma + Antecip (%)</label><input type="number" step="0.01" id="v2" value="11.4"></div>
  <div class="field"><label>Split Coprodutor (%)</label><input type="number" step="0.01" id="v3" value="30.0"></div>
  <div class="btn-row">
    <button class="btn-primary" id="calcBtn">Calcular & Auditar</button>
    <button class="btn-secondary" id="copyBtn">Copiar Relatório / CSV</button>
  </div>
  <div class="result-box" id="output">Pronto para processar dados localmente.</div>
  <div class="footer">Zero External Egress • Conformidade LGPD Brasil • R$ 34,90/mês</div>
  <script src="popup.js"></script>
</body>
</html>
